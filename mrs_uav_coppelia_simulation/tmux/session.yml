# do not modify these
root: ./
name: simulation
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these
pre_window: export UAV_NAME=uav1;
            export RUN_TYPE=simulation;
            export UAV_TYPE=x500;
            export USE_SIM_TIME=true;
            export RMW_IMPLEMENTATION=rmw_zenoh_cpp
startup_window: status
windows:
  - router:
      layout: tiled
      panes:
        - ros2 run rmw_zenoh_cpp rmw_zenohd
  - sim:
      layout: tiled
      panes:
        - /opt/coppelia-sim-edu/coppeliaSim.sh -f $(ros2 pkg prefix --share mrs_uav_coppelia_simulation)/coppelia_resources/world.ttt
  - hw_api:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_coppelia_api api.launch.py
  - control:
      layout: tiled
      panes:
        - waitForHwApi && ros2 launch mrs_uav_core core.launch.py
          platform_config:=$(ros2 pkg prefix --share mrs_uav_coppelia_simulation)/config/mrs_uav_system/coppelia_quad.yaml
          custom_config:=./config/custom_config.yaml
          world_config:=./config/world_config.yaml
          network_config:=./config/network_config.yaml
  - status:
      layout: tiled
      panes:
        - waitForHwApi && ros2 run mrs_uav_status status.sh
  - takeoff:
      layout: tiled
      panes:
        - waitForCore && ros2 service call /uav1/uav_manager/midair_activation std_srvs/srv/Trigger '{}'
  - rviz:
      layout: tiled
      panes:
        - waitForCore && ros2 run rviz2 rviz2 -d ./rviz.rviz --ros-args -p use_sim_time:=$USE_SIM_TIME
        - waitForCore && ros2 launch mrs_rviz_plugins load_robot.launch
  - layout:
      layout: tiled
      panes:
        - waitForCore && sleep 2; ~/.i3/layout_manager.sh ./layout.json
